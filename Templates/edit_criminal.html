<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Criminal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='edit_criminal.css') }}">
</head>
<body>

  <div class="d-flex justify-content-between p-3">
    <a href="{{ url_for('home') }}" class="btn btn-dark">← Back</a>
    <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
  </div>
  
  <div class="container py-5">
    <h2 class="text-center mb-4">Edit Criminal Information</h2>
    
    <form method="POST">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ criminal.name }}" required>
      </div>

      <div class="mb-3">
        <label for="age" class="form-label">Age</label>
        <input type="number" class="form-control" id="age" name="age" value="{{ criminal.age }}" required>
      </div>

      <div class="mb-3">
        <label for="criminalType" class="form-label">Crime Type</label>
        <input type="text" class="form-control" id="criminalType" name="criminalType" value="{{ criminal.criminal_type }}" required>
      </div>

      <div class="mb-3">
        <label for="lastSeen" class="form-label">Last Seen</label>
        <input type="text" class="form-control" id="lastSeen" name="lastSeen" value="{{ criminal.last_seen }}" required>
      </div>

      <div class="mb-3">
        <label for="image">Upload Image</label>
        <input type="file" class="form-control" id="image" name="image" accept="image/*">
      </div>

      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-success">Save Changes</button>
        <a href="{{ url_for('manage_criminals') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
  
</body>
</html>
