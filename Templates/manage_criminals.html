<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Criminal Database</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='manage_criminals.css') }}">
</head>
<body>

  <div class="d-flex justify-content-between p-3">
    <a href="{{ url_for('home') }}" class="btn btn-dark">← Back</a>
    <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
  </div>
  
  <div class="container py-5">
    <h2 class="text-center mb-4">Criminal Database</h2>

    <div class="mb-3 text-end">
      <a href="{{ url_for('add_criminal') }}" class="btn btn-success">Add Criminal</a>
    </div>

    {% if criminals %}
      <div class="row g-4">
        {% for c in criminals %}
          <div class="col-md-4">
            <div class="card h-100 shadow-sm">
              <img src="{{ url_for('uploaded_file', filename=c.image.split('/')[-1]) }}" class="card-img-top" alt="{{ c.name }}">
              <div class="card-body">
                <h5 class="card-title">{{ c.name }}</h5>
                <p class="card-text"><strong>Age:</strong> {{ c.age }}</p>
                <p class="card-text"><strong>Crime:</strong> {{ c.criminalType }}</p>
                <p class="card-text"><strong>Last Seen:</strong> {{ c.lastSeen }}</p>
              </div>
              <div class="card-footer d-flex justify-content-between">
                <a href="{{ url_for('edit_criminal', criminal_id=c.id) }}" class="btn btn-warning btn-sm">Edit</a>
              
                <form action="{{ url_for('remove_criminal', criminal_id=c.id) }}" method="post" onsubmit="return confirm('Are you sure you want to remove this criminal?');">
                  <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                </form>
              </div>              
            </div>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <p class="text-center text-muted">No records found.</p>
    {% endif %}
  </div>
  
</body>
</html>
